parameters:
  - name: environment
    displayName: Environment
    type: string
    values:
      - tst
      - acc
      - prd
  - name: command
    displayName: Command to Run
    type: string
    default: refresh
    values:
      - refresh
      - refresh-elastic
      - refresh-test-products
  - name: resetIndex
    displayName: Reset Elasticsearch Index
    type: boolean
    default: false

steps:
  - checkout: self
    fetchDepth: 0

  - template: dotnet-restore.yaml
    parameters:
      buildConfiguration: 'Release'

  - task: AzureKeyVault@2
    displayName: Download key vault secrets
    inputs:
      azureSubscription: sc-rg-weu-keyvault-${{parameters.environment}}
      KeyVaultName: kv-weu-buy-${{parameters.environment}}-001
      SecretsFilter: "*"
      RunAsPreJob: false

  - task: DotNetCoreCLI@2
    displayName: Run ${{parameters.command}}
    inputs:
      command: "run"
      projects: "$(Build.SourcesDirectory)/src/Tools/Tools.csproj"
      ${{ if eq(parameters.resetIndex, true) }}:
        arguments: "${{parameters.command}} resetIndex"
      ${{ if ne(parameters.resetIndex, true) }}:
        arguments: "${{parameters.command}}"
    env:
      ASPNETCORE_ENVIRONMENT: ${{parameters.environment}}
      Elasticsearch__ApiKey: $(kvs-elastic-search-api-key)
      ConnectionStrings__DefaultConnection: $(kvs-sql-connection-string-cost-models-db)
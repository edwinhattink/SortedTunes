steps:
  - template: npm-install.yaml

  - task: Npm@1
    displayName: Npm build $(environmentName)
    inputs:
      command: custom
      workingDir: "$(System.DefaultWorkingDirectory)/src/Web/ClientAppCostModels"
      customCommand: "run build"
    env:
      REACT_APP_AUTH0_DOMAIN: $(domain)
      REACT_APP_AUTH0_CLIENT_ID: $(clientId)
      REACT_APP_AUTH0_CALLBACK_URL: $(callbackUrl)
      REACT_APP_AUTH0_AUDIENCE: $(audience)
      REACT_APP_API_URL: $(apiUrl)
      REACT_APP_CMS_API_URL: $(cmsApiUrl)

  - task: PublishPipelineArtifact@1
    displayName: Publish $(environmentName) frontend
    inputs:
      targetPath: "$(System.DefaultWorkingDirectory)/src/Web/ClientAppCostModels/build"
      artifact: "$(environmentName)-frontend-build"
      publishLocation: "pipeline"
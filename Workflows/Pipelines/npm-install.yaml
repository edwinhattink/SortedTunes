parameters:
  - name: workingDirectory
    type: string
    default: "$(System.DefaultWorkingDirectory)/src/Web/ClientAppCostModels"

steps:
  - task: Cache@2
    displayName: Cache node_modules
    inputs:
      key: 'npm | "$(Agent.OS)" | ${{ parameters.workingDirectory }}/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: ${{ parameters.workingDirectory }}/node_modules
      cacheHitVar: NODE_MODULES_CACHE_HIT

  - task: npmAuthenticate@0
    displayName: Npm authenticate
    inputs:
      workingFile: "${{ parameters.workingDirectory }}/.npmrc"
    condition: ne(variables.NODE_MODULES_CACHE_HIT, 'true')

  - task: Npm@1
    displayName: Npm install
    inputs:
      workingDir: ${{ parameters.workingDirectory }}
      command: 'ci'  # Use 'ci' for faster, reproducible installs
    condition: ne(variables.NODE_MODULES_CACHE_HIT, 'true')
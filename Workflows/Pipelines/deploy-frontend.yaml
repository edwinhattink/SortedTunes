parameters:
  - name: environmentName

steps:
  - task: DownloadPipelineArtifact@2
    displayName: Download artifacts to deploy StaticWebApp
    inputs: 
      artifact: $(environmentName)-frontend-build
      path: './build'

  - task: AzureStaticWebApp@0
    displayName: Deploy Frontend
    inputs:
      app_location: "build"
      output_location: ""
      azure_static_web_apps_api_token: $(deploymentToken)
      skip_api_build: true
      skip_app_build: true
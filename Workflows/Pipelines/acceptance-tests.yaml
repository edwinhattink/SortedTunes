parameters:
  - name: buildConfiguration
    type: string
    default: Release
    values:
      - Release
      - Debug
  - name: environmentName
  - name: smokeOnly
    type: boolean
    default: true
    displayName: "Run Only Smoke Tests"

steps:
  - download: current
    displayName: Download artifacts
    artifact: drop

  - task: NuGetAuthenticate@1
    displayName: NuGet authenticate

  - task: AzureKeyVault@2
    displayName: Download key vault secrets
    inputs:
      azureSubscription: sc-rg-weu-keyvault-${{parameters.environmentName}}
      KeyVaultName: kv-weu-buy-$(environmentName)-001
      SecretsFilter: "*"
      RunAsPreJob: false

  - task: ExtractFiles@1
    displayName: Extract Acceptance Test files
    inputs:
      archiveFilePatterns: "$(Pipeline.Workspace)/drop/Web.AcceptanceTests.zip"
      destinationFolder: "$(Pipeline.Workspace)/drop/extracted/Web.AcceptanceTests"
      cleanDestinationFolder: true
      overwriteExistingFiles: false

  - task: UseDotNet@2
    displayName: "Install .NET SDKs"
    inputs:
      useGlobalJson: true

  - pwsh: $(Pipeline.Workspace)/drop/extracted/Web.AcceptanceTests/playwright.ps1 install
    displayName: Install Playwright

  - pwsh: $(Pipeline.Workspace)/drop/extracted/Web.AcceptanceTests/playwright.ps1 install-deps
    displayName: Install Playwright dependencies

  - task: DotNetCoreCLI@2
    displayName: Acceptance Test
    inputs:
      command: "test"
      ${{ if eq(parameters.smokeOnly, true) }}:
        arguments: "-c ${{parameters.buildConfiguration}} --filter TestCategory=smoke"
      ${{ else }}:
        arguments: "-c ${{parameters.buildConfiguration}}"
      publishTestResults: true
      testRunTitle: "Acceptance Tests - ${{parameters.environmentName}}"
      projects: |
        $(System.DefaultWorkingDirectory)/tests/Web.AcceptanceTests/Web.AcceptanceTests.csproj
    env:
      ASPNETCORE_ENVIRONMENT: $(environmentName)
      M2MClient__ClientId: $(acceptance-tests-client-id)
      M2MClient__ClientSecret: $(acceptance-tests-client-secret)
      Users__Admin__Password: $(acceptance-tests-user-admin)
      Users__User__Password: $(acceptance-tests-user)
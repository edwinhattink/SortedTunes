parameters:
  - name: buildConfiguration
    type: string
    default: 'Release'

steps:
  - task: PowerShell@2
    displayName: Set NuGet packages path
    inputs:
      targetType: 'inline'
      script: |
        $nugetPath = "$(Pipeline.Workspace)/.nuget/packages"
        Write-Host "##vso[task.setvariable variable=NUGET_PACKAGES]$nugetPath"
        Write-Host "Set NUGET_PACKAGES to: $nugetPath"
      pwsh: true

  - task: Cache@2
    inputs:
      key: 'nuget | "$(Agent.OS)" | $(System.DefaultWorkingDirectory)/**/*.csproj, $(System.DefaultWorkingDirectory)/Directory.Packages.props, $(System.DefaultWorkingDirectory)/Directory.Build.props'
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: $(NUGET_PACKAGES)
      cacheHitVar: NUGET_CACHE_HIT
    displayName: 'Cache NuGet packages'

  - task: NuGetAuthenticate@1
    displayName: NuGet authenticate

  - task: UseDotNet@2
    displayName: "Install .NET SDKs"
    inputs:
      useGlobalJson: true

  - task: DotNetCoreCLI@2
    displayName: "Restore solutions"
    env: 
      NUGET_PACKAGES: '$(NUGET_PACKAGES)'
    inputs:
      command: restore
      feedsToUse: "config"
      projects: "**/*.sln"
      nugetConfigPath: "$(System.DefaultWorkingDirectory)/nuget.config"
